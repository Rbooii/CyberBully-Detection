[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberbully"
version = "0.1.0"
description = "Deteksi cyberbullying teks bahasa Indonesia dengan IndoBERT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.46",
    "accelerate>=0.30",
    "datasets>=2.20",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
